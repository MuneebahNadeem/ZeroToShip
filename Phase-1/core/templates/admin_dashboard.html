<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrative Workspace</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Sports Club Management System</h1>
        <p>Welcome, Administrator!</p>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Club Rosters -->
        <section id="club-rosters">
            <h2>Active Club Members</h2>

            <table id="roster-table">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Club</th>
                        <th>Membership Type</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- JavaScript will create roster rows here -->
                </tbody>
            </table>
        </section>

        <!-- User Management -->
        <section id="user-management">
            <h2>User Management</h2>

            <button>Add Member</button>
            <button>Edit Member</button>
            <button>Remove Member</button>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Sports Club Management System. All rights reserved.</p>
    </footer>

    <script src="../static/js/admin.js"></script>

</body>

</html>

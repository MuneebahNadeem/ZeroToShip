{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Student Dashboard</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">
```

</head>

<body>

```
<!-- Header -->
<header>
    <h1>Sports Club Management System</h1>
    <p>Welcome, Student!</p>
</header>

<!-- Main Content -->
<main>

    <!-- Sports Club Section -->
    <section id="sports-clubs">
        <h2>Sports Clubs</h2>

        <div id="club-container">
            <!-- JavaScript will create club cards here -->
        </div>
    </section>

    <!-- Registration Form Section -->
    <section id="registration-form">
        <h2>Club Registration Form</h2>

        <form>

            <label for="club">Select Club</label>

            <select id="club" required>
                <option value="" selected disabled hidden>
                    Select a Club
                </option>
            </select>

            <button type="submit">Register</button>

        </form>
    </section>

</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Sports Club Management System. All rights reserved.</p>
</footer>

<script src="{% static 'js/student.js' %}"></script>
```

</body>

</html>
